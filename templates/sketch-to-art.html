<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sketch to Art</title>
</head>
<body>
    <h1>Sketch to Art Generator</h1>
    <form action="/upload" method="post" enctype="multipart/form-data">
        <label for="sketch">Upload your sketch:</label>
        <input type="file" id="sketch" name="sketch" required><br><br>
        
        <label for="prompt">Art description (prompt):</label>
        <input type="text" id="prompt" name="prompt" placeholder="Describe your art" required><br><br>
        
        <label for="strength">Art strength (0 to 1):</label>
        <input type="number" id="strength" name="strength" step="0.1" min="0" max="1" value="0.8" required><br><br>
        
        <button type="submit">Generate Art</button>
    </form>
</body>
</html>
