<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Design</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }

        .container {
            width: 80%;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.5rem;
            color: #005d67;
        }

        p {
            font-size: 1.2rem;
            color: #333;
        }

        .input-section {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        label {
            font-size: 1rem;
            color: #333;
            margin-bottom: 10px;
            display: block;
        }

        textarea,
        input[type="file"],
        input[type="range"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 1rem;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #005d67;
            color: white;
            padding: 10px 20px;
            font-size: 1.2rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #004f58;
        }

        .result-section {
            margin-top: 30px;
        }

        #generated-image-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }

        footer {
            text-align: center;
            padding: 20px 0;
            background-color: #333;
            color: white;
            font-size: 1rem;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Simple Design Page</h1>
            <p>Use this page to interact with the application and view results.</p>
        </header>

        <div class="input-section">
            <label for="text-input">Enter Text:</label>
            <textarea id="text-input" rows="4" placeholder="Type something..."></textarea>

            <label for="file-input">Upload an Image:</label>
            <input type="file" id="file-input">

            <button>Submit</button>
        </div>

        <div class="result-section">
            <h2>Generated Result</h2>
            <div id="generated-image-container">
                <p>No result generated yet.</p>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Simple Design</p>
    </footer>
</body>
</html>
